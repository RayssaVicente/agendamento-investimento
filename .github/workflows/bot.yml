name: Bot ações telegram

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * *"
    - cron: "0 15 * * *"
    - cron: "0 18 * * *"
    - cron: "0 19 * * *"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          # Instalação explícita para garantir que os módulos sejam encontrados
          pip install requests yfinance supabase python-dotenv
          # Se tiver mais libs no requirements.txt, rode o comando abaixo também:
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Rodar script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # Certifique-se que o nome do segredo no GitHub é exatamente SUPABASE_KEY
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }} 
          TZ: "America/Sao_Paulo"
        run: |
          python bot.py
          python -c "from db_config import verificar_metas_trade; verificar_metas_trade()"

      - name: Salvar alterações
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add historico.csv dados/ranking.csv graficos/rendimento.png || echo "Arquivos não encontrados, pulando..."
          git commit -m "Auto: Atualizando indicadores e gráficos" || exit 0
          git push