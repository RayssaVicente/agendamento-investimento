name: Bot ações telegram

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * *"
    - cron: "0 15 * * *"
    - cron: "0 17 * * *"
    - cron: "0 19 * * *"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rodar script
        env:
          # Segredos do Telegram
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          # Segredos do Supabase (ADICIONEI AQUI)
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_KEY }}
          TZ: "America/Sao_Paulo"
        run: |
          # Primeiro roda o bot principal
          python bot.py
          # Em seguida roda a verificação de metas (o seu novo arquivo de lógica)
          python -c "from db_config import verificar_metas_trade; verificar_metas_trade()"

      - name: Salvar alterações (CSV e Gráficos)
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add historico.csv dados/ranking.csv graficos/rendimento.png
          git commit -m "Auto: Atualizando indicadores e gráficos" || exit 0
          git push